<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182330"><title>하츠 | 검사의 밤</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#243040;background:#e8e8e5}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}main{height:100vh;height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;background:#f4f3ef;box-shadow:0 0 50px #26313a24}.head{background:linear-gradient(135deg,#202d3d,#121c28);color:white;padding:22px 20px 16px;flex:none}.eyebrow{font-size:10px;letter-spacing:3px;color:#d6b69c;margin-bottom:12px;font-weight:700}.profile{display:flex;align-items:center;gap:13px}.avatar{height:62px;width:62px;border-radius:18px;border:1px solid #8c9299;object-fit:cover;background:#343b46}.name{font-weight:800;font-size:23px;letter-spacing:1px}.status{color:#c9d1d9;font-size:12px;margin-top:4px}.online{display:inline-block;width:7px;height:7px;background:#9bd1b2;border-radius:50%;margin-right:5px}.stats{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#e6d6c4;margin-top:20px}.track{height:5px;border-radius:5px;background:#47525e;margin-top:8px;overflow:hidden}.fill{height:100%;width:5%;background:linear-gradient(90deg,#b57c76,#e6c69b);transition:width .3s}.scene{font-size:11px;color:#8a8075;text-align:center;margin:14px 0 5px}.chat{flex:1;overflow:auto;padding:8px 17px 20px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}.msg{display:flex;flex-direction:column;max-width:86%;gap:4px}.msg.h{align-self:flex-start}.msg.u{align-self:flex-end}.who{font-size:11px;color:#857e75;margin-left:5px}.bubble{padding:12px 15px;line-height:1.65;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px;box-shadow:0 2px 9px #00000008}.h .bubble{background:white;color:#263342;border-top-left-radius:4px;border:1px solid #e8e5df}.u .bubble{background:#dce6ef;color:#1f3042;border-top-right-radius:4px}.foot{border-top:1px solid #e1dfda;background:#fff;padding:10px 14px max(12px,env(safe-area-inset-bottom));flex:none}.choices{display:flex;gap:7px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none}.choices button{border:1px solid #cbb6a6;background:#fff9f3;color:#654c45;border-radius:20px;padding:9px 13px;font-size:12px;white-space:nowrap}.composer{display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid #d9d8d4;border-radius:13px;background:#f7f7f5;padding:13px 14px;color:#222;font-size:15px;outline:none}.composer input:focus{border-color:#a77b72}.send{background:#27394b;color:#fff;border:0;border-radius:13px;padding:0 18px;font-weight:700}.send:disabled{opacity:.4}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:10px;color:#8b8b8b}.reset{border:0;background:transparent;color:#8a665d;text-decoration:underline;font-size:11px;padding:4px}.note{max-width:680px;margin:auto;font-size:11px;color:#777;text-align:center;padding:8px}@media(max-width:600px){.head{padding-top:17px}.bubble{font-size:14px}.avatar{width:55px;height:55px}.name{font-size:21px}}</style></head><body><main><header class="head"><div class="eyebrow">TOWER OF GOD · FAN SIMULATION</div><div class="profile"><img class="avatar" id="avatar" src="https://i.pinimg.com/736x/2e/e8/18/2ee818c68fb68515263f1f375d993527.jpg" alt="하츠 프로필" onerror="this.style.display='none';document.getElementById('avatarFallback').style.display='grid'"><div id="avatarFallback" class="avatar" style="display:none;place-items:center;font-size:29px">⚔</div><div><div class="name">하츠</div><div class="status"><span class="online"></span>시험의 층 · 대화 중</div></div></div><div class="stats"><span id="relation">낯선 동료</span><span id="affText">호감도 5 / 100</span></div><div class="track"><div id="fill" class="fill"></div></div></header><div class="scene">검사의 밤 · 비공식 팬메이드 채팅 시뮬레이션</div><section id="chat" class="chat" aria-live="polite"></section><footer class="foot"><div id="choices" class="choices"><button type="button" data-choice="안녕, 하츠">안녕, 하츠</button><button type="button" data-choice="같이 훈련하자">같이 훈련하자</button><button type="button" data-choice="나 보고 싶었어?">나 보고 싶었어?</button><button type="button" data-choice="오늘은 뭐 해?">오늘은 뭐 해?</button></div><form id="form" class="composer"><input id="input" maxlength="300" autocomplete="off" placeholder="하츠에게 메시지 보내기..." aria-label="메시지 입력"><button id="send" class="send" type="submit">전송</button></form><div class="bottom"><span>무료 · AI 연결 없음 · 이 기기에만 저장</span><button class="reset" type="button" id="reset">처음부터 시작</button></div></footer></main><script>
(function(){'use strict';const KEY='hatz-share-v1';const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form'),choices=document.getElementById('choices'),reset=document.getElementById('reset');const initial=[{role:'h',text:'……너였군. 이 시간에 무슨 일이지?'}];let state={aff:5,turn:0,messages:initial.slice()};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.messages)&&typeof saved.aff==='number'){state={aff:Math.min(100,Math.max(0,saved.aff)),turn:Number(saved.turn)||0,messages:saved.messages.slice(-120).filter(m=>m&&['h','u'].includes(m.role)&&typeof m.text==='string')}}}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function bubble(m){const el=document.createElement('div');el.className='msg '+m.role;if(m.role==='h'){const name=document.createElement('div');name.className='who';name.textContent='하츠';el.appendChild(name)}const b=document.createElement('div');b.className='bubble';b.textContent=m.text;el.appendChild(b);return el}function render(){chat.replaceChildren(...state.messages.map(bubble));document.getElementById('relation').textContent=state.aff>=70?'서로에게 특별한 사이':state.aff>=40?'가까워지는 동료':state.aff>=20?'신뢰하는 동료':'낯선 동료';document.getElementById('affText').textContent='호감도 '+state.aff+' / 100';document.getElementById('fill').style.width=state.aff+'%';chat.scrollTop=chat.scrollHeight}function reply(q){const s=q.replace(/\s/g,'');const a=state.aff;let text='',points=1;if(/안녕|반가|하이/.test(s)){text='……왔군. 별일 없었나?';points=2}else if(/검|훈련|수련|강해|싸움/.test(s)){text='검은 거짓말을 하지 않는다. 노력한 만큼 움직이지. ……원한다면 네 자세도 봐주겠다.';points=4}else if(/좋아해|사랑해|사귀|고백/.test(s)){text=a>=45?'……그런 말을 아무렇지 않게 하는군. 나도 네가 신경 쓰인다.':'……갑작스럽군. 그런 말은 가볍게 하는 게 아니다.';points=a>=45?5:1}else if(/보고싶|그리웠/.test(s)){text=a>=30?'……나도 네가 보이지 않아 신경 쓰였다.':'……왜? 무슨 일이라도 있었나?';points=3}else if(/힘들|슬퍼|우울|외로|울고|속상/.test(s)){text='……무슨 일이 있었지? 내가 말을 잘하는 편은 아니다. 그래도 듣고는 있겠다.';points=3}else if(/다쳤|아파|괜찮아|걱정/.test(s)){text='이 정도는 괜찮다. ……네가 걱정할 정도는 아니야. 너는 다친 곳 없나?';points=3}else if(/손잡|안아|키스|뽀뽀/.test(s)){text=a>=50?'……사람들이 보고 있다. 이쪽으로 와.':'……너무 갑작스럽다.';points=2}else if(/같이|산책|데이트|놀자/.test(s)){text='……훈련이 끝나면 시간을 내겠다. 뒤처지지만 마.';points=3}else if(/뭐해|심심|뭐하고/.test(s)){text='검을 손질하고 있었다. ……너는 할 일이 없는 건가?';points=2}else if(/고마워|고맙/.test(s)){text='……별일 아니다.';points=3}else if(/잘자|졸려|굿나잇/.test(s)){text='내일 훈련에 지장 없도록 충분히 자. ……잘 자.';points=2}else if(/멋있|잘생|귀여/.test(s)){text='……외모보다 검술을 봐줬으면 좋겠군.';points=2}else if(/밥|먹었|배고/.test(s)){text='아직이라면 먹어 둬. 체력이 없으면 아무것도 할 수 없다.';points=2}else if(/질투|다른사람|엔도르시/.test(s)){text=a>=35?'……그 사람과 친한 건 네 자유다. 다만, 조금 신경 쓰이는군.':'……그런 건 내게 물을 일이 아니다.';points=2}else{const variants=['……그래서, 네 생각은 어떤데?','듣고 있다. 계속 말해 봐.','……그렇군. 그런 생각을 하고 있었나.','네 말은 알겠다. 하지만 난 조금 다르게 생각한다.'];text=variants[state.turn%variants.length]}return {text,points}}function send(raw){const q=String(raw||'').trim();if(!q)return;const r=reply(q);state.turn++;state.aff=Math.min(100,state.aff+r.points);state.messages.push({role:'u',text:q},{role:'h',text:r.text});state.messages=state.messages.slice(-120);input.value='';render();save()}form.addEventListener('submit',e=>{e.preventDefault();send(input.value)});choices.addEventListener('click',e=>{const btn=e.target.closest('button[data-choice]');if(btn)send(btn.dataset.choice)});reset.addEventListener('click',()=>{if(!confirm('대화 기록과 호감도를 초기화할까?'))return;state={aff:5,turn:0,messages:initial.slice()};save();render()});render()})();
</script></body></html>
