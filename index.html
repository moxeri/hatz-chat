e-height:1.85;color:#24313e;white-space:pre-wrap}.speaker{font-size:11px;font-weight:800;color:#6a5a4b;margin-bottom:5px}.prompt{font-size:12px;color:#706a62;margin:26px 0 11px;font-weight:750}.options{display:grid;gap:10px}.choice{display:flex;align-items:center;text-align:left;gap:12px;width:100%;min-height:62px;background:#fff;border:1px solid #ded9d0;border-radius:15px;padding:13px 15px;color:#26313b;box-shadow:0 2px 8px #00000006;font-size:14px;line-height:1.55}.choice:active{background:#e8e0d6;transform:scale(.995)}.num{width:27px;height:27px;display:grid;place-items:center;background:#eee8df;color:#856e5b;border-radius:9px;flex:none;font-size:12px;font-weight:850}.choice span:nth-child(2){flex:1}.feedback{border-left:3px solid #bb9377;background:#f0e9df;padding:13px 15px;border-radius:4px 12px 12px 4px;font-size:13px;line-height:1.7;margin-top:18px;color:#51483f}.feedback b{color:#76533d}.actions{display:flex;gap:9px;margin-top:20px}.action{border:0;border-radius:12px;padding:13px 16px;background:#263747;color:white;font-weight:750;flex:1}.action.secondary{background:#e5e0d7;color:#514d46}.foot{border-top:1px solid #e1ded7;padding:13px 18px max(17px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:#8a8278;background:#faf9f6}.foot button{background:transparent;border:0;color:#806650;text-decoration:underline;font-size:11px}.endingTitle{font-size:24px;font-weight:850;color:#273648;line-height:1.4}.endingTag{font-size:11px;color:#a27857;letter-spacing:2px;font-weight:800}.endingScene{margin-top:20px}.collection{margin-top:22px;padding:16px;border:1px solid #e2dcd1;border-radius:15px;background:#fff}.collection h3{font-size:13px;margin:0 0 12px}.badges{display:flex;flex-wrap:wrap;gap:7px}.endingBadge{font-size:11px;padding:7px 9px;border-radius:9px;background:#eeeae4;color:#80786e}.endingBadge.found{background:#e3ece6;color:#385b48}.history{margin-top:15px;font-size:12px;color:#6d6963;line-he 'use strict';
const nodes={"opening": ["프롤로그 · 검을 든 소년", "시험이 끝난 늦은 밤. 복도 끝에서 하츠가 홀로 검을 손질하고 있다.", "……아직 안 돌아갔나. 무슨 일이지?", [["검을 손질하는 모습이 궁금해서.", "……검에 관심이 있나? 의외군.", 2, 2, 1, "training", "curious"], ["혼자 있길래 말 걸어봤어.", "……혼자 있는 게 편할 때도 있다. 하지만 방해는 아니다.", 2, 1, 0, "training", "gentle"], ["너 진짜 말수 적다.", "……할 말이 없으면 하지 않을 뿐이다.", -2, -1, 1, "training", "tease"]]], "training": ["1장 · 검의 무게", "하츠는 잠시 너를 보더니 훈련장 쪽으로 고개를 돌린다.", "곧 훈련을 시작할 거다. 따라오겠나?", [["나도 해볼래. 가르쳐 줘.", "좋아. 하지만 대충 할 생각이면 그만둬라.", 3, 3, 2, "spar", "train"], ["옆에서 지켜볼게.", "……보고 배우는 것도 방법이다.", 2, 2, 0, "spar", "watch"], ["오늘은 훈련 말고 놀자.", "지금은 그럴 때가 아니다.", -3, -2, 0, "spar", "avoid"]]], "spar": ["1장 · 첫 번째 일격", "훈련 중 하츠의 검이 바람을 가른다. 너는 균형을 잃고 바닥에 주저앉는다.", "괜찮나? 무리해서 일어나지 마라.", [["괜찮아. 다시 해볼래.", "……좋은 눈빛이군. 다시 자세를 잡아라.", 3, 3, 2, "corridor", "persevere"], ["손 좀 잡아줄래?", "……일어나라. 손은 잡아주겠다.", 3, 1, 1, "corridor", "touch"], ["너무 세게 하는 거 아니야?", "……미안하다. 힘 조절이 부족했군.", 0, 1, 0, "corridor", "complain"]]], "corridor": ["2장 · 밤의 복도", "훈련 후, 십이수가 하츠에게 무리하지 말라고 잔소리를 한다. 하츠는 말없이 돌아선다.", "……다들 참 말이 많군.", [["십이수도 널 걱정해서 그러는 거야.", "……알고 있다. 그래서 더 할 말이 없는 거다.", 2, 3, 0, "mission", "team"], ["넌 혼자서도 잘할 것 같아.", "혼자서 모든 걸 해낼 수는 없다.", 0, 0, 0, "mission", "alone"], ["그럼 나한테만 이야기해 줘.", "……왜 네게만 말해야 하지?", 2, 0, 2, "mission", "flirt"]]], "mission": ["2장 · 균열의 시작", "다음 시험에서 팀은 두 갈래 길 앞에 선다. 한쪽은 빠르지만 위험하다.", "결정해야 한다. 시간이 없다.", [["동료들과 상의해서 결정하자.", "……동의한다. 서두르는 것보다 중요하다.", 2, 4, 1, "danger", "cooperate"], ["네 판단을 믿고 따라갈게.", "……내 판단에 책임지겠다.", 3, 2, 1, "danger", "follow"], ["위험해도 빨리 가는 게 낫지.", "위험을 가볍게 보지 마라.", -2, -2, 2, "danger", "rush"]]], "danger": ["3장 · 흔들리는 검끝", "통로가 무너지고, 하츠가 잔해 아래에 갇힌 동료를 구하려 한다.", "뒤로 물러서라. 여기부터는 위험하다.", [["나도 도울게. 역할을 나누자.", "……좋아. 내 신호에 맞춰 움직여라.", 3, 4, 3, "aftermath", "rescue"], ["네가 다치면 안 돼. 가지 마.", "……걱정은 고맙다. 하지만 동료를 버릴 순 없다.", 1, -2, 0, "aftermath", "stop"], ["무서워. 먼저 안전한 곳으로 갈게.", "……알겠다. 무사히 돌아가라.", -2, -2, -2, "aftermath", "retreat"]]], "aftermath": ["3장 · 남겨진 말", "시험이 끝난 뒤 하츠는 팔에 작은 상처를 입은 채 돌아온다.", "별것 아니다. 이 정도는 익숙하다.", [["익숙해도 아픈 건 아픈 거잖아.", "……너는 이상한 데서 고집이 세군. 고맙다.", 3, 3, 1, "rooftop", "care"], ["다음에는 더 조심해 줘.", "……노력하지.", 2, 2, 0, "rooftop", "promise"], ["역시 넌 정말 강하구나.", "강함만으로 모든 걸 지킬 수 있는 건 아니다.", 1, 0, 0, "rooftop", "admire"]]], "rooftop": ["4장 · 별이 보이는 곳", "옥상. 하츠가 너와 나란히 서서 먼 곳을 바라본다. 바람이 조용히 스친다.", "……오늘은 꽤 많은 일이 있었군.", [["너와 함께라서 버틸 수 있었어.", "……나도 네 덕분에 놓치지 않은 게 있다.", 4, 3, 2, "secret", "bond"], ["넌 왜 그렇게 강해지고 싶어?", "……지키고 싶은 게 있기 때문이다.", 2, 4, 1, "secret", "belief"], ["이런 분위기면 고백해도 돼?", "……갑자기 무슨 소리냐.", 2, 0, 3, "secret", "direct"]]], "secret": ["4장 · 말하지 못한 마음", "잠시 침묵이 흐른다. 하츠가 먼저 입을 연다.", "너는…… 내가 어떤 사람이라고 생각하지?", [["말보다 행동으로 책임지는 사람.", "……그렇게 봐주는 건가.", 3, 4, 1, "rival", "understand"], ["조금 고집스럽지만 좋은 사람.", "……고집스럽다는 건 인정한다.", 3, 2, 1, "rival", "honest"], ["잘생기고 멋진 검사!", "……그것 말고는 없나?", 1, 0, 0, "rival", "surface"]]], "rival": ["5장 · 엇갈린 시선", "다른 동료가 너에게 함께 다음 시험을 준비하자고 제안한다. 하츠는 아무 말 없이 검을 쥔다.", "……그쪽과 갈 건가?", [["모두 함께 준비하는 게 좋겠어.", "……그래. 그게 더 합리적이다.", 2, 3, 0, "conflict", "inclusive"], ["네가 신경 쓰인다면 안 갈게.", "……내 기분 때문에 선택을 바꾸지 마라.", 1, -1, 0, "conflict", "cling"], ["왜? 질투라도 해?", "……쓸데없는 추측이다.", 2, 0, 2, "conflict", "jealous"]]], "conflict": ["5장 · 부딪히는 신념", "작전 회의에서 하츠가 위험한 선봉 역할을 자청한다. 너는 그의 결정을 이해하기 어렵다.", "내가 앞에 서는 게 가장 낫다.", [["네 판단을 존중해. 대신 계획을 세우자.", "……좋다. 네 의견을 듣겠다.", 3, 4, 2, "separation", "respect"], ["무조건 안 돼. 내 말 들어.", "……네 걱정은 알지만 명령하지 마라.", -3, -3, 0, "separation", "control"], ["네가 가면 나도 무조건 따라갈 거야.", "……자신을 위험에 던지지 마라.", 1, -1, 2, "separation", "reckless"]]], "separation": ["6장 · 선택의 순간", "시험 직전, 팀을 나누라는 지시가 떨어진다. 하츠는 네 선택을 기다린다.", "……어떻게 할 생각이지?", [["각자 맡은 일을 끝내고 다시 만나자.", "……약속하지. 반드시 돌아오겠다.", 3, 4, 2, "reunion", "independent"], ["무슨 일이 있어도 네 옆에 있을래.", "……네가 정말 원한다면 막진 않겠다.", 3, 1, 1, "reunion", "together"], ["이번엔 다른 팀으로 갈게.", "……알겠다. 네 선택을 존중한다.", 0, 1, 1, "reunion", "distance"]]], "reunion": ["7장 · 다시 만난 밤", "긴 시험이 끝나고 너는 하츠와 다시 마주한다. 하츠가 먼저 네 이름을 부른다.", "……무사했군. 다행이다.", [["약속 지켰네. 나도 돌아왔어.", "……그래. 기다리고 있었다.", 4, 4, 2, "confession", "promise_kept"], ["나 엄청 보고 싶었어.", "……그런 말은…… 조금 곤란하군.", 4, 1, 2, "confession", "miss"], ["이제 다 끝났으니 각자 가자.", "……그래. 수고했다.", -3, -2, 0, "confession", "cold"]]], "confession": ["마지막 장 · 검이 향하는 곳", "하츠가 검을 칼집에 넣고 네 앞에 선다. 오랫동안 미뤄둔 말을 꺼낼 시간이다.", "……네게 하고 싶은 말이 있다. 먼저 말하겠나?", [["좋아해. 네 곁에서 함께 성장하고 싶어.", "……그 마음을 가볍게 듣지 않겠다.", 4, 4, 2, "ENDING", "mature"], ["나만 바라봐 주면 안 돼?", "……나는 검도, 동료도 버릴 수 없다.", 2, -3, 0, "ENDING", "possessive"], ["지금은 답하지 않아도 돼. 기다릴게.", "……네 배려는 알고 있다.", 2, 3, 1, "ENDING", "patient"]]]};
const endings={"true": ["진엔딩 · 같은 방향의 검", "하츠는 조용히 네 손을 잡는다.", "“검을 놓을 생각은 없다. 하지만 이제는…… 네가 있는 미래도 지키고 싶다.”", "서로의 신념을 존중하며 나란히 탑을 오르기로 했다."], "romance": ["해피엔딩 · 서툰 고백", "하츠가 잠시 시선을 피한다.", "“……좋아한다. 이런 말은 익숙하지 않지만, 진심이다.”", "느리지만 분명한 사랑이 시작된다."], "partner": ["동료엔딩 · 등을 맡길 사람", "하츠는 너에게 검집을 건네며 고개를 끄덕인다.", "“네게라면 등을 맡길 수 있겠군.”", "사랑보다 깊은 전우애가 남았다."], "promise": ["희망엔딩 · 다음 시험에서", "하츠가 떠나기 전 걸음을 멈춘다.", "“……다음에 만나면, 그때는 내 말을 끝까지 하겠다.”", "아직 결론은 나지 않았다. 이야기는 계속된다."], "normal": ["노멀엔딩 · 지나가는 인연", "시험이 끝나고 두 사람은 각자의 길로 향한다.", "“……함께해서 나쁘지 않았다. 무사히 올라가라.”", "서로에게 의미 있는 동료로 남았다."], "fail": ["공략 실패 · 닿지 않은 마음", "하츠는 한참 침묵하다가 단호하게 말한다.", "“네 마음은 알겠다. 하지만 같은 길을 걷기는 어렵겠군.”", "서로의 가치관은 끝내 맞닿지 못했다."], "bad": ["배드엔딩 · 부러진 신뢰", "마지막 시험에서 두 사람은 서로를 믿지 못한다.", "“……네가 나를 이해해 줄 거라 생각했다.”", "작은 오해들이 쌓여 관계가 무너졌다."], "solo": ["독립엔딩 · 각자의 탑", "너는 스스로의 목표를 선택한다. 하츠는 고개를 끄덕인다.", "“……네 길을 가라. 그 선택을 존중한다.”", "사랑이 아니더라도 스스로의 길을 찾았다."], "secret": ["히든엔딩 · 검보다 먼저", "사람들이 떠난 훈련장. 하츠가 너에게 검 대신 작은 매듭을 건넨다.", "“이건 약속의 표시다. ……네게만 주는 거다.”", "말보다 행동이 먼저인 검사의 특별한 약속."]};
const total=Object.keys(nodes).length;
const STORE='hatz-choices-v2';const GALLERY='hatz-endings-v2';
const $=id=>document.getElementById(id);
const clamp=n=>Math.max(0,Math.min(100,n));
const initial=()=>({node:'opening',a:12,t:10,c:10,steps:0,flags:[],history:[],feedback:null,ending:null});
function load(k,fallback){try{let v=JSON.parse(localStorage.getItem(k));return v||fallback}catch(e){return fallback}}
let state=load(STORE,initial());if(!state||(!nodes[state.node]&&!state.ending))state=initial();
let gallery=load(GALLERY,[]);if(!Array.isArray(gallery))gallery=[];
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(GALLERY,JSON.stringify(gallery))}catch(e){}}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function showStats(){for(const [key,n] of [['a','a'],['t','t'],['c','c']]){$(n+'Num').textContent=state[key];$(n+'Bar').style.width=state[key]+'%'}$('progress').style.width=Math.min(100,(state.steps/14)*100)+'%';$('status').textContent=state.ending?'이야기가 끝났어':(state.steps+1)+'번째 장면 · 선택을 기다리는 중'}
function add(parent,tag,cls,txt){const x=el(tag,cls,txt);parent.appendChild(x);return x}
function calcEnding(){const f=state.flags;const has=x=>f.includes(x);if(state.t<=7||state.a<=5)return 'bad';if(has('possessive')&&state.t<42)return 'fail';if(state.a>=48&&state.t>=48&&state.c>=25&&has('rescue')&&has('respect')&&has('independent')&&has('mature')&&has('understand'))return 'secret';if(state.a>=43&&state.t>=43&&has('mature')&&(has('rescue')||has('cooperate')))return 'true';if(state.a>=37&&state.t>=31&&!has('possessive'))return 'romance';if(state.t>=37&&state.a<37)return 'partner';if(has('distance')&&state.a<32)return 'solo';if(state.t<23&&state.a<34)return 'fail';if(state.a>=36&&state.t>=30)return 'promise';return 'normal'}
function choose(i){const n=nodes[state.node];if(!n||state.feedback)return;const o=n[3][i];if(!o)return;const [label,reply,a,t,c,next,flag]=o;state.a=clamp(state.a+a);state.t=clamp(state.t+t);state.c=clamp(state.c+c);state.flags.push(flag);state.history.push({chapter:n[0],choice:label});state.steps++;state.feedback={label,reply,a,t,c,next};save();render()}
function advance(){if(!state.feedback)return;const next=state.feedback.next;state.feedback=null;if(next==='ENDING'){state.ending=calcEnding();if(!gallery.includes(state.ending))gallery.push(state.ending)}else state.node=next;save();render()}
function restart(){if(!confirm('현재 진행을 초기화하고 다시 시작할까?\n발견한 엔딩 기록은 유지돼.'))return;state=initial();save();render()}
function render(){showStats();const root=$('screen');root.replaceChildren();$('footerText').textContent=state.ending?'엔딩 도감 '+gallery.length+' / '+Object.keys(endings).length:'진행 '+state.steps+' / 14 · 엔딩 '+gallery.length+'종 발견';if(state.ending){renderEnding(root);return}const n=nodes[state.node];add(root,'div','chapter',n[0]);add(root,'div','scene',n[1]);const d=add(root,'div','dialogue');const pic=add(d,'img','portrait');pic.src=$('avatar').src;pic.alt='';pic.onerror=()=>{pic.style.display='none'};const speech=add(d,'div','speech');add(speech,'div','speaker','하츠');add(speech,'div','',state.feedback?state.feedback.reply:n[2]);if(state.feedback){const fb=add(root,'div','feedback');add(fb,'b','', '선택: '+state.feedback.label);add(fb,'div','flash',`호감도 ${delta(state.feedback.a)}  ·  신뢰도 ${delta(state.feedback.t)}  ·  용기 ${delta(state.feedback.c)}`);const btn=add(root,'button','action','다음 이야기 →');btn.style.marginTop='22px';btn.onclick=advance}else{add(root,'div','prompt','어떻게 대답할까?');const options=add(root,'div','options');n[3].forEach((o,i)=>{const b=add(options,'button','choice');b.type='button';add(b,'span','num',String(i+1).padStart(2,'0'));add(b,'span','',o[0]);add(b,'span','', '›');b.onclick=()=>choose(i)})}window.scrollTo({top:0,behavior:'instant'})}
function delta(v){return (v>0?'+':'')+v}
function renderEnding(root){const e=endings[state.ending];add(root,'div','endingTag','ENDING UNLOCKED');add(root,'div','endingTitle',e[0]);add(root,'div','scene endingScene',e[1]);const d=add(root,'div','dialogue');const s=add(d,'div','speech');add(s,'div','speaker','하츠');add(s,'div','',e[2]);add(root,'div','feedback',e[3]);const actions=add(root,'div','actions');const again=add(actions,'button','action','다른 결말 도전');again.onclick=()=>{state=initial();save();render()};const hist=add(actions,'button','action secondary','내 선택 보기');hist.onclick=()=>{const h=$('history');h.hidden=!h.hidden};const history=add(root,'div','history');history.id='history';history.hidden=true;state.history.forEach((h,i)=>add(history,'div','',`${i+1}. ${h.choice}`));const collection=add(root,'div','collection');add(collection,'h3','','엔딩 도감 · '+gallery.length+'/'+Object.keys(endings).length);const badges=add(collection,'div','badges');Object.entries(endings).forEach(([id,v])=>add(badges,'span','endingBadge '+(gallery.includes(id)?'found':''),gallery.includes(id)?v[0]:'??? · 미발견'));add(root,'div','notice','엔딩은 선택에 따라 결정돼. 진엔딩 외에도 숨겨진 결말이 있어.')}
$('restart').onclick=restart;render();
</script></body></html>
